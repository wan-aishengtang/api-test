public_check_email_cases:
  - case_name: "检查已注册邮箱"
    email: "2711771004@qq.com"
    expect_http_status: 200
    expect_code: 1001
  - case_name: "检查未注册邮箱"
    email: "__RUNTIME_UNREGISTERED_EMAIL__"
    expect_http_status: 200
    expect_code: 200

public_send_register_code_cases:
  - case_name: "注册验证码接口校验已注册邮箱"
    email: "2711771004@qq.com"
    expect_http_status: 200
    expect_code: 410

public_send_reset_code_cases:
  - case_name: "重置验证码接口校验未注册邮箱"
    email: "__RUNTIME_UNREGISTERED_EMAIL__"
    expect_http_status: 200
    expect_code: 404

public_verify_code_negative_cases:
  - case_name: "注册验证码校验失败"
    email: "__RUNTIME_UNREGISTERED_EMAIL__"
    code: "000000"
    type: "register"
    expect_http_status: 200
    expect_code: 400
  - case_name: "重置验证码校验失败"
    email: "2711771004@qq.com"
    code: "000000"
    type: "reset"
    expect_http_status: 200
    expect_code: 400

public_register_negative_cases:
  - case_name: "注册接口拦截无效 verify_token"
    email: "__RUNTIME_UNREGISTERED_EMAIL__"
    password: "Abcd1234"
    verify_token: "invalid-register-token"
    expect_http_status: 403
    expect_code: 403

public_reset_password_negative_cases:
  - case_name: "重置密码接口拦截无效 verify_token"
    email: "2711771004@qq.com"
    new_password: "Abcd1234"
    verify_token: "invalid-reset-token"
    expect_http_status: 403
    expect_code: 403

