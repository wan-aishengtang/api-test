negative_cases:
  - case_name: "实时天气缺少鉴权"
    api: "weather_now"
    location: "39.9042:116.4074"
    expect_http_status_any: [401, 403]
    expect_code_any: [401, 4010, 4016, 403]
  - case_name: "地点搜索缺少关键参数"
    api: "location_search"
    keyword: ""
    expect_http_status_any: [401, 403]
    expect_code_any: [401, 4010, 4016, 403]
  - case_name: "游客 Token 接口缺少签名"
    api: "guest_token_without_signature"
    expect_http_status: 403
    expect_code: 403
  - case_name: "注册验证码接口缺少签名"
    api: "register_code_without_signature"
    email: "2711771004@qq.com"
    expect_http_status: 200
    expect_code: 403

admin_forbidden_cases:
  - case_name: "普通用户无权查看管理员用户列表"
    api: "admin_user_list"
    expect_http_status: 403
    expect_status: "error"
  - case_name: "普通用户无权查看管理员流量统计"
    api: "admin_traffic_stats"
    expect_http_status: 403
    expect_status: "error"
  - case_name: "普通用户无权查看管理员服务器状态"
    api: "admin_server_status"
    expect_http_status: 403
    expect_status: "error"
  - case_name: "普通用户无权编辑管理员用户"
    api: "admin_edit_user"
    target_user_id: 1
    expect_http_status: 403
    expect_status: "error"
  - case_name: "普通用户无权删除管理员用户"
    api: "admin_delete_user"
    target_user_id: 1
    expect_http_status: 403
    expect_status: "error"
  - case_name: "普通用户无权批量删除管理员用户"
    api: "admin_batch_delete_users"
    ids: [1]
    expect_http_status: 403
    expect_status: "error"

admin_success_list_cases:
  - case_name: "管理员查看用户列表"
    page: 1
    page_size: 10
    expect_http_status: 200
    expect_status: "success"

admin_success_system_cases:
  - case_name: "管理员查看流量统计"
    days: 7
    expect_http_status: 200
    expect_status: "success"
  - case_name: "管理员查看服务器状态"
    expect_http_status: 200
