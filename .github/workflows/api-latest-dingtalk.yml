name: API Latest Report To DingTalk

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
      timezone: "Asia/Shanghai"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: api-latest-report
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      test_exit_code: ${{ steps.run_tests.outputs.test_exit_code }}
      report_status: ${{ steps.run_tests.outputs.report_status }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests PyYAML allure-pytest

      - name: Install Allure CLI
        run: npm install -g allure-commandline

      - name: Restore previous Allure history from GitHub Pages
        env:
          PAGES_HISTORY_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/history
        shell: bash
        run: |
          mkdir -p report/html/history
          python - <<'PY'
          import os
          import pathlib
          import urllib.error
          import urllib.request

          base_url = os.environ["PAGES_HISTORY_BASE_URL"].rstrip("/")
          target_dir = pathlib.Path("report/html/history")
          target_dir.mkdir(parents=True, exist_ok=True)

          history_files = [
              "history.json",
              "history-trend.json",
              "duration-trend.json",
              "retry-trend.json",
              "categories-trend.json",
          ]

          downloaded = []
          for filename in history_files:
              url = f"{base_url}/{filename}"
              target_path = target_dir / filename
              try:
                  with urllib.request.urlopen(url, timeout=20) as response:
                      target_path.write_bytes(response.read())
                  downloaded.append(filename)
              except urllib.error.URLError:
                  pass

          if downloaded:
              print("Restored history files:", ", ".join(downloaded))
          else:
              print("No previous Allure history found on GitHub Pages; continuing with a fresh history baseline.")
          PY

      - name: Run API tests and generate latest Allure report
        id: run_tests
        env:
          WEATHER_API_BASE_URL: ${{ secrets.WEATHER_API_BASE_URL }}
          WEATHER_USER_EMAIL: ${{ secrets.WEATHER_USER_EMAIL }}
          WEATHER_USER_PASSWORD: ${{ secrets.WEATHER_USER_PASSWORD }}
          WEATHER_ADMIN_EMAIL: ${{ secrets.WEATHER_ADMIN_EMAIL }}
          WEATHER_ADMIN_PASSWORD: ${{ secrets.WEATHER_ADMIN_PASSWORD }}
          WEATHER_VERIFY_SSL: "false"
          WEATHER_CA_BUNDLE: ${{ vars.WEATHER_CA_BUNDLE }}
        shell: bash
        run: |
          set +e
          python run.py
          TEST_EXIT_CODE=$?
          echo "test_exit_code=${TEST_EXIT_CODE}" >> "$GITHUB_OUTPUT"
          if [ "$TEST_EXIT_CODE" -eq 0 ]; then
            echo "report_status=SUCCESS" >> "$GITHUB_OUTPUT"
          else
            echo "report_status=FAILED" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Upload latest report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latest-allure-report
          path: |
            report/html
            report/xml
          retention-days: 15

      - name: Configure GitHub Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Upload latest Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v4
        with:
          path: report/html

  deploy:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy latest report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    if: always()
    needs: [test, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Send latest report link to DingTalk
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          REPORT_STATUS: ${{ needs.test.outputs.report_status }}
          TEST_EXIT_CODE: ${{ needs.test.outputs.test_exit_code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.request

          webhook = os.environ.get("DINGTALK_WEBHOOK", "").strip()
          if not webhook:
              print("DINGTALK_WEBHOOK is empty", file=sys.stderr)
              sys.exit(1)

          page_url = os.environ.get("PAGE_URL", "").strip()
          report_status = os.environ.get("REPORT_STATUS", "UNKNOWN").strip()
          test_exit_code = os.environ.get("TEST_EXIT_CODE", "").strip()
          run_url = os.environ.get("RUN_URL", "").strip()
          run_number = os.environ.get("RUN_NUMBER", "").strip()
          repository = os.environ.get("REPOSITORY", "").strip()

          lines = [
              "### 接口自动化报告",
              f"- Repo: `{repository}`",
              f"- Run Number: `{run_number}`",
              f"- Status: `{report_status}`",
              f"- Pytest Exit Code: `{test_exit_code}`",
              f"- Latest Report: {page_url or 'Pages deployment failed, check workflow run'}",
              f"- Workflow Run: {run_url}",
          ]
          payload = {
              "msgtype": "markdown",
              "markdown": {
                  "title": "接口自动化报告",
                  "text": "\n".join(lines),
              },
          }

          request = urllib.request.Request(
              webhook,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              print(response.read().decode("utf-8", errors="ignore"))
          PY
